<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BFSI Daily: insurance and banking news in plain language</title>
  <meta name="description"
    content="A daily digest of insurance and BFSI news with plain-language summaries for students and industry professionals.">
  <style>
    :root {
      --bg: #f1f3ff;
      --ink: #14183a;
      --muted: #4d5578;
      --line: #d9ddf5;
      --panel: #ffffff;
      --shadow: rgba(40, 30, 120, 0.22);
      --serif: Georgia, "Times New Roman", serif;
      --sans: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0e24;
        --ink: #eef0ff;
        --muted: #aab2d8;
        --line: #27305c;
        --panel: #141a3a;
        --shadow: rgba(0, 0, 0, 0.6);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
      background: var(--bg);
    }

    [data-cat="All"] {
      --c: #4338ca;
    }

    [data-cat="Regulatory"] {
      --c: #7c3aed;
    }

    [data-cat="Life"] {
      --c: #0f766e;
    }

    [data-cat="General"] {
      --c: #1d4ed8;
    }

    [data-cat="Health"] {
      --c: #c2410c;
    }

    [data-cat="Banking"] {
      --c: #b45309;
    }

    [data-cat="Fintech"] {
      --c: #be185d;
    }

    [data-cat="Markets"] {
      --c: #475569;
    }

    .hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      padding: 2.5rem 1.25rem 4.5rem;
      border-radius: 0 0 2.5rem 2.5rem;
      background: linear-gradient(120deg, #3730a3, #7c3aed, #be185d, #0f766e, #3730a3);
      background-size: 300% 300%;
    }

    .hero .inner {
      position: relative;
      z-index: 1;
      max-width: 64rem;
      margin: 0 auto;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.4;
      pointer-events: none;
    }

    .b1 {
      width: 18rem;
      height: 18rem;
      background: #f59e0b;
      top: -7rem;
      right: -4rem;
    }

    .b2 {
      width: 14rem;
      height: 14rem;
      background: #22d3ee;
      bottom: -6rem;
      right: 18%;
    }

    .b3 {
      width: 10rem;
      height: 10rem;
      background: #f472b6;
      top: 35%;
      left: -4rem;
    }

    .brand {
      display: inline-block;
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.3rem 0.95rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
    }

    .date {
      margin: 1rem 0 0.4rem;
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(2.2rem, 9vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0 0 1.2rem;
      max-width: 34rem;
      font-size: 1.1rem;
    }

    .stat {
      display: inline-block;
      margin: 0;
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      background: #fde047;
      color: #2a1f00;
      font-weight: 800;
    }

    .wrap {
      max-width: 64rem;
      margin: 0 auto;
      padding: 0 1.25rem 4rem;
    }

    .ticker {
      position: relative;
      z-index: 2;
      margin-top: -1.6rem;
      overflow: hidden;
      white-space: nowrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 10px 24px -12px var(--shadow);
    }

    .track {
      display: inline-flex;
      width: max-content;
      padding: 0.75rem 0;
    }

    .tick {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding-right: 2.5rem;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .tick i {
      flex: none;
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      background: var(--c);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1.5rem 0;
    }

    .filters button {
      font: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 0.45rem 1.05rem;
      border-radius: 999px;
      border: 2px solid var(--c);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .filters button:hover {
      background: var(--c);
      color: #fff;
    }

    .filters button[aria-pressed="true"] {
      background: var(--c);
      color: #fff;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr));
      gap: 1.25rem;
    }

    .card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding: 1.6rem 1.4rem 1.3rem;
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      background-color: var(--panel);
      background-image: linear-gradient(180deg, color-mix(in srgb, var(--c) 13%, var(--panel)), var(--panel) 45%);
      box-shadow: 0 8px 20px -12px var(--shadow);
      transition: box-shadow 0.25s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: var(--c);
    }

    .num {
      position: absolute;
      top: 0.8rem;
      right: 1.1rem;
      font-family: var(--serif);
      font-weight: 700;
      font-size: 3.2rem;
      line-height: 1;
      color: var(--c);
      opacity: 0.17;
      pointer-events: none;
    }

    .pill {
      align-self: flex-start;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: var(--c);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
    }

    h2 {
      margin: 0;
      padding-right: 2.6rem;
      font-family: var(--serif);
      font-size: 1.3rem;
      line-height: 1.25;
    }

    .summary {
      margin: 0;
    }

    .why {
      margin: 0;
      padding: 0.75rem 0.9rem;
      border-radius: 0.85rem;
      background: rgba(127, 127, 127, 0.12);
      background: color-mix(in srgb, var(--c) 14%, transparent);
      font-size: 0.95rem;
    }

    .why strong {
      display: block;
      margin-bottom: 0.15rem;
      font-size: 0.82rem;
    }

    .foot {
      margin-top: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.9rem;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .go {
      padding: 0.4rem 0.95rem;
      border-radius: 999px;
      background: var(--c);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .go:hover {
      filter: brightness(1.15);
    }

    .state {
      padding: 2rem 0;
      color: var(--muted);
    }

    .note {
      margin: 2.5rem 0 0;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      max-width: 40rem;
      font-size: 0.88rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero {
        animation: flow 18s ease infinite;
      }

      @keyframes flow {

        0%,
        100% {
          background-position: 0% 50%;
        }

        50% {
          background-position: 100% 50%;
        }
      }

      .blob {
        animation: float 11s ease-in-out infinite alternate;
      }

      .b2 {
        animation-duration: 14s;
        animation-delay: -4s;
      }

      .b3 {
        animation-duration: 9s;
        animation-delay: -2s;
      }

      @keyframes float {
        from {
          transform: translate(0, 0) scale(1);
        }

        to {
          transform: translate(2rem, 1.5rem) scale(1.15);
        }
      }

      .track {
        animation: scroll 70s linear infinite;
      }

      .ticker:hover .track {
        animation-play-state: paused;
      }

      @keyframes scroll {
        to {
          transform: translateX(-50%);
        }
      }

      .card {
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 30px -14px var(--shadow);
      }

      .js .card {
        opacity: 0;
      }

      .js .card.in {
        opacity: 1;
        animation: rise 0.6s ease backwards;
        animation-delay: var(--d, 0ms);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
      }

      .filters button {
        transition: background 0.2s, color 0.2s, transform 0.2s;
      }

      .filters button:hover {
        transform: translateY(-2px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker {
        display: none;
      }

      .wrap {
        padding-top: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <header class="hero">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <div class="inner">
      <h1 class="brand">BFSI Daily</h1>
      <p class="date" id="date">Loading today’s news</p>
      <p class="lede" id="lede">Insurance and banking news, explained in plain language.</p>
      <p class="stat" id="stat" hidden><span id="count">0</span> stories today</p>
    </div>
  </header>
  <div class="wrap">
    <div class="ticker" aria-hidden="true">
      <div class="track" id="track"></div>
    </div>
    <nav class="filters" id="filters" aria-label="Filter stories by category"></nav>
    <main id="list" aria-live="polite"></main>
    <p class="note">Summaries are written by AI from the linked articles and may contain mistakes. Check the original
      source before relying on any detail. Updated every morning.</p>
  </div>
  <script>
    (function () {
      var list = document.getElementById("list");
      var filters = document.getElementById("filters");
      var track = document.getElementById("track");
      var stories = [];
      var active = "All";
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.documentElement.classList.add("js");

      var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
        });
      }, { threshold: 0.1 }) : null;

      function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function safeUrl(u) {
        try { var p = new URL(u); return (p.protocol === "https:" || p.protocol === "http:") ? p.href : null; }
        catch (e) { return null; }
      }

      function showState(msg) { list.replaceChildren(el("p", "state", msg)); }

      function render() {
        var shown = stories.filter(function (s) { return active === "All" || s.category === active; });
        if (!shown.length) { showState("No stories in this category today."); return; }
        var grid = el("div", "grid");
        shown.forEach(function (s, i) {
          var card = el("article", "card");
          card.setAttribute("data-cat", s.category);
          card.style.setProperty("--d", Math.min(i, 5) * 70 + "ms");
          var num = el("span", "num", (i + 1 < 10 ? "0" : "") + (i + 1));
          num.setAttribute("aria-hidden", "true");
          card.appendChild(num);
          card.appendChild(el("span", "pill", s.category));
          card.appendChild(el("h2", null, s.headline));
          card.appendChild(el("p", "summary", s.summary));
          if (s.why_it_matters) {
            var why = el("p", "why");
            why.appendChild(el("strong", null, "Why it matters"));
            why.appendChild(document.createTextNode(s.why_it_matters));
            card.appendChild(why);
          }
          var foot = el("div", "foot");
          foot.appendChild(el("span", null, "Source: " + s.source));
          var url = safeUrl(s.link);
          if (url) {
            var a = el("a", "go", "Read the original");
            a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
            foot.appendChild(a);
          }
          card.appendChild(foot);
          grid.appendChild(card);
          if (io) { io.observe(card); } else { card.classList.add("in"); }
        });
        list.replaceChildren(grid);
      }

      function buildFilters() {
        var cats = ["All"];
        stories.forEach(function (s) { if (cats.indexOf(s.category) === -1) cats.push(s.category); });
        filters.replaceChildren.apply(filters, cats.map(function (c) {
          var b = el("button", null, c);
          b.type = "button";
          b.setAttribute("data-cat", c);
          b.setAttribute("aria-pressed", String(c === active));
          b.addEventListener("click", function () {
            active = c;
            Array.prototype.forEach.call(filters.children, function (x) { x.setAttribute("aria-pressed", String(x === b)); });
            render();
          });
          return b;
        }));
      }

      function buildTicker() {
        var frag = document.createDocumentFragment();
        for (var n = 0; n < 2; n++) {
          stories.forEach(function (s) {
            var t = el("span", "tick");
            t.setAttribute("data-cat", s.category);
            t.appendChild(el("i"));
            t.appendChild(document.createTextNode(s.headline));
            frag.appendChild(t);
          });
        }
        track.replaceChildren(frag);
      }

      function countTo(n) {
        var out = document.getElementById("count");
        document.getElementById("stat").hidden = false;
        if (reduce || !window.requestAnimationFrame) { out.textContent = n; return; }
        var t0 = null;
        function step(t) {
          if (t0 === null) t0 = t;
          var p = Math.min((t - t0) / 900, 1);
          out.textContent = Math.round(n * p);
          if (p < 1) window.requestAnimationFrame(step);
        }
        window.requestAnimationFrame(step);
      }

      fetch("news.json", { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (data) {
          stories = (data.stories || []).filter(function (s) { return s && s.headline && s.summary; });
          var d = new Date(data.date + "T00:00:00");
          document.getElementById("date").textContent = isNaN(d) ? "Today’s news"
            : d.toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
          if (!stories.length) { showState("No stories were published today. Check back tomorrow morning."); return; }
          countTo(stories.length);
          buildTicker();
          buildFilters();
          render();
        })
        .catch(function () {
          document.getElementById("date").textContent = "BFSI Daily";
          showState("We could not load today’s news. If you are testing on your own computer, open this page through a local server instead of double-clicking the file.");
        });
    })();
  </script>
</body>

</html>
